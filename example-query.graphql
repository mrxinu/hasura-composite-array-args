# Strongly-typed-in-SQL, stringly-typed-at-the-edge.
#
# Hasura exposes `mountains_input` as a custom scalar named `_mountains`
# (Postgres's internal name for the `mountains[]` array type). The value
# is a Postgres array literal of composite literals; the function receives
# a real mountains[] and Postgres enforces the shape (column count,
# column types, order).
#
# Composite literal grammar reminder:
#   array:     {elem1,elem2,...}
#   element:   "(col1,col2,...)"   -- composite, double-quoted in the array
#   text col:  bare if no spaces/commas, else "double-quoted" inside the
#              composite, which means \" when embedded in a JSON string.

query TallMountains($m: _mountains!) {
  summarize_mountains(args: { mountains_input: $m }) {
    id
    name
    elevation_m
    first_summited
  }
}

# Variables (paste into the GraphiQL "Variables" panel):
# {
#   "m": "{\"(1,K2,8611,1954)\",\"(2,Denali,6190,1913)\",\"(3,\\\"Mont Blanc\\\",4809,1786)\"}"
# }
